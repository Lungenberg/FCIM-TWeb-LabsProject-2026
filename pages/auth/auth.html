<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicStore - Вход</title>
    <link rel="stylesheet" href="../../style/common.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<header class="site-header">
    <div class="container">
        <a href="../../index.html" class="site-logo">
            <i class="fa-solid fa-music"></i> MusicStore
        </a>
        <ul class="top-nav">
            <li><a href="../../index.html"><i class="fa-solid fa-house"></i> Главная</a></li>
            <li><a href="../catalog/catalog.html"><i class="fa-solid fa-compact-disc"></i> Каталог</a></li>
            <li><a href="../about/about.html"><i class="fa-solid fa-circle-info"></i> О нас</a></li>
            <li><a href="../contacts/contacts.html"><i class="fa-solid fa-phone"></i> Контакты</a></li>
            <li><a href="../news/news.html"><i class="fa-solid fa-newspaper"></i> Новости</a></li>
        </ul>
        <div class="header-right">
            <span class="header-phone"><i class="fa-solid fa-phone"></i> +373 22 123 456</span>
        </div>
    </div>
</header>

<div class="page-hero">
    <div class="container">
        <h1><i class="fa-solid fa-user"></i> Личный кабинет</h1>
    </div>
</div>

<main class="auth-main">
    <div class="container">
        <div class="auth-card">

            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">Вход</button>
                <button class="auth-tab" data-tab="register">Регистрация</button>
            </div>

            <!-- Login Form -->
            <form class="auth-form" id="login-form">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" placeholder="example@mail.com" required>
                    <span class="field-error" id="err-login-email"></span>
                </div>
                <div class="form-group">
                    <label for="login-password">Пароль</label>
                    <input type="password" id="login-password" placeholder="Минимум 6 символов" required>
                    <span class="field-error" id="err-login-password"></span>
                </div>
                <div class="auth-error" id="login-error"></div>
                <button type="submit" class="btn btn-primary auth-submit">Войти</button>
            </form>

            <!-- Register Form -->
            <form class="auth-form" id="register-form" style="display:none">
                <div class="form-group">
                    <label for="reg-name">Ваше имя</label>
                    <input type="text" id="reg-name" placeholder="Иван Иванов" required>
                    <span class="field-error" id="err-reg-name"></span>
                </div>
                <div class="form-group">
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" placeholder="example@mail.com" required>
                    <span class="field-error" id="err-reg-email"></span>
                </div>
                <div class="form-group">
                    <label for="reg-password">Пароль</label>
                    <input type="password" id="reg-password" placeholder="Минимум 6 символов" required>
                    <span class="field-error" id="err-reg-password"></span>
                </div>
                <div class="form-group">
                    <label for="reg-password2">Повторите пароль</label>
                    <input type="password" id="reg-password2" placeholder="Повторите пароль" required>
                    <span class="field-error" id="err-reg-password2"></span>
                </div>
                <div class="auth-error" id="register-error"></div>
                <button type="submit" class="btn btn-primary auth-submit">Зарегистрироваться</button>
            </form>

        </div>
    </div>
</main>

<footer class="site-footer">
    <div class="footer-top">
        <div class="container">
            <div class="footer-col">
                <div class="footer-logo"><i class="fa-solid fa-music"></i> MusicStore</div>
                <p class="footer-about">Магазин лучших музыкальных альбомов.</p>
            </div>
            <div class="footer-col">
                <h4>Контакты</h4>
                <div class="footer-contact-item"><i class="fa-solid fa-phone"></i><a href="tel:+37322123456">+373 22 123 456</a></div>
                <div class="footer-contact-item"><i class="fa-solid fa-envelope"></i><a href="mailto:info@musicstore.md">info@musicstore.md</a></div>
            </div>
        </div>
    </div>
    <div class="footer-bottom">
        <div class="container">&copy; 2025 MusicStore. Все права защищены.</div>
    </div>
</footer>

<script src="auth.js"></script>

</body>
</html>
